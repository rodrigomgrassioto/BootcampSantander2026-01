spring.application.name=612-budgetingProjFinalComIA

spring.ai.openai.api-key=${OPENAI_API_KEY}
#spring.ai.openai.chat.options.model=gpt-4o-mini // antigo
spring.ai.openai.chat.base-url=http://192.168.100.10:1234/v1
spring.ai.openai.chat.model=qwen/qwen3-v1-8b
spring.ai.openai.chat.temperature=0.8
spring.ai.openai.chat.max-tokens=800
spring.ai.openai.chat.response-format.type=TEXT

spring.ai.openai.audio.transcription.model=whisper-medium
spring.ai.openai.audio.transcription.base-url=http://192.168.100.10:8080
spring.ai.openai.audio.transcription.language=pt
spring.ai.openai.audio.transcription.temperature=0
spring.ai.openai.audio.transcription.response-format=text
spring.ai.openai.audio.transcription.prompt=Áudio em português brasileiro.\
   Áudio tem descrição de gastos financeiros.\
  As frases contem: \
  - um valor em reais (número + "reais"); \
  - uma ação (gastei, paguei, comprei); \
  - um local de estabelecimento (mercado, farmácia, restaurante, loja, etc).

spring.ai.model.audio.speech=openai
spring.ai.openai.audio.speech.base-url=http://192.168.100.10:8880/v1
spring.ai.openai.audio.speech.model=gpt-4o-mini-tts
spring.ai.openai.audio.speech.voice=pf_dora
spring.ai.openai.audio.speech.speed=1.2
spring.ai.openai.audio.speech.response-format=mp3

logging.level.org.springframework.ai=DEBUG


